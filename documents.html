<body class="antialiased text-gray-800 bg-gray-50 inner-brand-bg" data-page="documents">
<!-- bmas:header -->

<main id="main" class="documents-shell">
  <section class="documents-hero">
    <div class="documents-hero-inner max-w-6xl mx-auto px-6">
      <div class="documents-hero-copy">
        <p>
          Browse BMAS surveys, compliance tools, payroll templates, and advisory resources prepared for employers that need usable documents, not generic downloads.
        </p>
        <div class="documents-hero-actions">
          <a href="#resourceCatalog" class="documents-primary-link">Browse resources</a>
          <a href="/account?next=/library" class="documents-secondary-link">Sign in / create account</a>
          <a href="/library" class="documents-secondary-link">Open my library</a>
        </div>
      </div>
    </div>
  </section>

  <section id="resourceCatalog" class="max-w-6xl mx-auto px-6 py-12">
    <div id="documentsReturnNotice" class="hidden mb-6 rounded border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900"></div>

    <div class="documents-catalog-shell">
      <section>
        <div class="documents-catalog-header">
          <div>
            <p class="documents-section-label">Catalog</p>
            <h2>Choose a resource</h2>
          </div>
          <label class="documents-filter">
            <span>Category</span>
            <select id="documentsCategory">
              <option value="">All categories</option>
            </select>
          </label>
        </div>

        <div id="documentsStatus" class="documents-status">Loading resources...</div>
        <div id="documentsList" class="documents-list"></div>
      </section>
    </div>
  </section>
</main>
