<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Arena Join - BMAS</title>
  <link rel="icon" type="image/png" href="bmas.png" />
  <link rel="stylesheet" href="assets/tailwind.css?v=20260501-1" />
  <link rel="stylesheet" href="assets/site.css?v=20260430-quiz-app" />
</head>
<body data-page="arena-join" class="antialiased text-gray-800 bg-gray-50 inner-brand-bg">
  <main class="max-w-5xl mx-auto px-6 py-10 space-y-8">
    <section class="quiz-brand-hero overflow-hidden rounded-3xl border border-slate-200 text-white shadow-2xl">
      <div class="px-6 py-10 md:px-10 md:py-12">
        <p class="text-sm font-semibold uppercase tracking-[0.22em] text-amber-300">Public Competitive Knowledge Arena</p>
        <h1 class="mt-3 text-3xl md:text-4xl font-black">Participant Entry</h1>
        <p class="mt-4 text-slate-200 max-w-3xl">Join with your display name and school/company. No account required.</p>
      </div>
    </section>

    <p id="globalError" class="rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800"></p>

    <section class="grid gap-6 lg:grid-cols-2">
      <article class="quiz-brand-card rounded-3xl p-6">
        <p class="text-sm font-semibold uppercase tracking-[0.22em] text-amber-700">Join Room</p>
        <h2 class="mt-2 text-2xl font-bold text-slate-900">Enter with join code</h2>
        <form id="joinForm" class="mt-5 grid gap-3">
          <input id="joinCode" required placeholder="Join code" class="rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-amber-500 focus:ring-amber-500" />
          <input id="displayName" required placeholder="Display name" class="rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-amber-500 focus:ring-amber-500" />
          <input id="organization" required placeholder="School / Company" class="rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-amber-500 focus:ring-amber-500" />
          <button class="rounded-full bg-slate-900 px-5 py-3 text-sm font-semibold text-white">Join Arena</button>
        </form>
        <p id="joinState" class="mt-4 text-sm text-slate-600"></p>
      </article>

      <article class="quiz-brand-card rounded-3xl p-6">
        <div class="flex items-center justify-between gap-3">
          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.22em] text-amber-700">Live Question</p>
            <h2 class="mt-2 text-2xl font-bold text-slate-900">Current prompt</h2>
          </div>
          <button id="refreshStateBtn" class="rounded-full border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700">Refresh</button>
        </div>
        <div id="activeQuestion" class="mt-5 rounded-2xl border border-slate-200 bg-white/80 p-4 text-sm text-slate-700">Join a room to view question.</div>
      </article>
    </section>

    <section class="quiz-brand-card rounded-3xl p-6">
      <p class="text-sm font-semibold uppercase tracking-[0.22em] text-amber-700">Submit Answer</p>
      <h2 class="mt-2 text-2xl font-bold text-slate-900">Single submission per question</h2>
      <form id="submitAnswerForm" class="mt-5 grid gap-3 md:grid-cols-2">
        <input id="selectedOption" type="number" min="0" max="3" required placeholder="Option index (0-3)" class="rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-amber-500 focus:ring-amber-500" />
        <input id="responseMs" type="number" min="0" placeholder="Response time in ms (optional)" class="rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-amber-500 focus:ring-amber-500" />
        <button class="rounded-full bg-amber-500 px-5 py-3 text-sm font-semibold text-white md:col-span-2 hover:bg-amber-600">Submit Response</button>
      </form>
      <p id="submitState" class="mt-4 text-sm text-slate-600"></p>
    </section>
  </main>

  <script type="module" src="/assets/arena.js"></script>
</body>
</html>
