<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Arena Leaderboard - BMAS</title>
  <link rel="icon" type="image/png" href="bmas.png" />
  <link rel="stylesheet" href="assets/tailwind.css?v=20260501-1" />
  <link rel="stylesheet" href="assets/site.css?v=20260430-quiz-app" />
</head>
<body data-page="arena-leaderboard" class="antialiased text-gray-800 bg-gray-50 inner-brand-bg">
  <main class="max-w-5xl mx-auto px-6 py-10 space-y-8">
    <section class="quiz-brand-hero overflow-hidden rounded-3xl border border-slate-200 text-white shadow-2xl">
      <div class="px-6 py-10 md:px-10 md:py-12">
        <p class="text-sm font-semibold uppercase tracking-[0.22em] text-amber-300">Public Competitive Knowledge Arena</p>
        <h1 class="mt-3 text-3xl md:text-4xl font-black">Live Leaderboard</h1>
        <p class="mt-4 text-slate-200 max-w-3xl">Public standings ranked by accuracy, then speed, then total weighted score.</p>
      </div>
    </section>

    <p id="globalError" class="rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800"></p>

    <section class="quiz-brand-card rounded-3xl p-6">
      <p class="text-sm font-semibold uppercase tracking-[0.22em] text-amber-700">Lookup</p>
      <h2 class="mt-2 text-2xl font-bold text-slate-900">Load room standings</h2>
      <form id="leaderboardForm" class="mt-5 flex flex-col gap-3 sm:flex-row">
        <input id="leaderboardRoomId" required placeholder="Room ID" class="flex-1 rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-amber-500 focus:ring-amber-500" />
        <button class="rounded-full bg-slate-900 px-5 py-3 text-sm font-semibold text-white">Load Leaderboard</button>
      </form>
    </section>

    <section class="quiz-brand-card rounded-3xl p-6">
      <div class="flex items-end justify-between gap-4">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.22em] text-amber-700">Standings</p>
          <h2 class="mt-2 text-2xl font-bold text-slate-900">Current rankings</h2>
        </div>
      </div>
      <ol id="leaderboardList" class="mt-5 space-y-2 text-sm text-slate-700"></ol>
    </section>
  </main>

  <script type="module" src="/assets/arena.js"></script>
</body>
</html>
