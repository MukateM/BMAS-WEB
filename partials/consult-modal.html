<div id="consultModal" class="fixed inset-0 hidden items-center justify-center z-50 p-4" role="dialog" aria-modal="true" aria-labelledby="consultTitle">
  <div class="absolute inset-0 modal-backdrop z-0" id="modalBackdrop"></div>
  <div class="relative z-10 w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-lg bg-white p-6 shadow-lg">
    <div class="flex justify-between items-center">
      <h3 class="text-lg font-semibold" id="consultTitle">Request a Consultation</h3>
      <button id="closeConsult" class="text-slate-600" type="button" aria-label="Close dialog">&times;</button>
    </div>
    <form id="consultForm" class="mt-4 space-y-3"
          action="https://formspree.io/f/xldoyovv" method="POST" novalidate>
      <input type="text" name="_gotcha" class="hidden" tabindex="-1" autocomplete="off" />
      <input id="c_name" name="Full Name" required autocomplete="name" placeholder="Full Name" class="w-full rounded border px-3 py-2" />
      <input id="c_email" name="Email" type="email" required autocomplete="email" placeholder="Email" class="w-full rounded border px-3 py-2" />
      <input id="c_phone" name="Phone Number" required autocomplete="tel" placeholder="Phone Number" class="w-full rounded border px-3 py-2" />
      <input id="c_company" name="Company" autocomplete="organization" placeholder="Company (optional)" class="w-full rounded border px-3 py-2" />
      <textarea id="c_message" name="Message" rows="4" placeholder="Message" class="w-full rounded border px-3 py-2"></textarea>
      <p class="text-xs text-slate-500">We respond within 1 business day. Your details are only used to respond to your enquiry.</p>
      <div class="flex items-center gap-3">
        <button type="submit" class="px-4 py-2 bg-amber-400 text-slate-900 rounded">Send</button>
        <button id="clearConsult" type="button" class="px-4 py-2 border rounded">Clear</button>
      </div>
    </form>
  </div>
</div>
