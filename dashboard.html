<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Sales Dashboard – BMAS</title>
  <link rel="icon" type="image/png" href="bmas.png" />
  <link rel="stylesheet" href="assets/tailwind.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <main class="mx-auto max-w-7xl px-4 py-8">
    <section id="loginPanel" class="flex min-h-[75vh] items-center justify-center">
      <form id="loginForm" class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-7 shadow-sm">
        <p class="text-xs font-bold uppercase tracking-[.2em] text-amber-700">BMAS secure workspace</p>
        <h1 class="mt-2 text-3xl font-extrabold">Sales dashboard</h1>
        <p class="mt-2 text-sm text-slate-600">Sign in with your authorized BMAS staff account.</p>
        <label class="mt-6 block text-sm font-semibold" for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="username" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3" />
        <label class="mt-4 block text-sm font-semibold" for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3" />
        <button class="mt-5 w-full rounded-lg bg-slate-900 px-4 py-3 font-semibold text-white hover:bg-slate-700">Sign in</button>
        <p id="loginStatus" class="mt-4 min-h-5 text-sm text-slate-600" role="status"></p>
      </form>
    </section>

    <section id="dashboardPanel" class="hidden">
      <header class="flex flex-col gap-4 rounded-2xl bg-slate-900 p-6 text-white md:flex-row md:items-center md:justify-between">
        <div><p class="text-xs font-bold uppercase tracking-[.2em] text-amber-300">BMAS</p><h1 class="mt-1 text-3xl font-extrabold">Sales pipeline</h1><p id="staffIdentity" class="mt-1 text-sm text-slate-300"></p></div>
        <button id="signOut" class="rounded-lg border border-slate-600 px-4 py-2 text-sm font-semibold hover:bg-slate-800">Sign out</button>
      </header>

      <div id="metrics" class="mt-6 grid grid-cols-2 gap-3 md:grid-cols-6"></div>
      <div class="mt-6 flex flex-col gap-3 rounded-xl border border-slate-200 bg-white p-4 md:flex-row">
        <input id="search" type="search" placeholder="Search name, company, or email" class="flex-1 rounded-lg border border-slate-300 px-3 py-2" />
        <select id="statusFilter" class="rounded-lg border border-slate-300 px-3 py-2"><option value="">All stages</option><option value="new">New</option><option value="contacted">Contacted</option><option value="qualified">Qualified</option><option value="proposal">Proposal</option><option value="won">Won</option><option value="lost">Lost</option></select>
        <button id="refresh" class="rounded-lg bg-slate-900 px-5 py-2 font-semibold text-white">Refresh</button>
      </div>
      <p id="dashboardStatus" class="mt-3 min-h-5 text-sm text-slate-600" role="status"></p>
      <div id="leadGrid" class="mt-3 grid gap-4 lg:grid-cols-2"></div>
    </section>
  </main>
  <script type="module" src="assets/dashboard.js"></script>
</body>
</html>
