  <style>
    .job-shell { max-width: 960px; margin: 0 auto; }
    .job-back { display:inline-flex; align-items:center; gap:0.35rem; color:#12727C; font-size:0.875rem; font-weight:650; text-decoration:none; }
    .job-back:hover { color:#0f5f68; text-decoration:underline; }
    .job-hero { margin-top:1rem; padding-bottom:1.5rem; border-bottom:1px solid #e2e8f0; }
    .job-kicker { font-size:0.75rem; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:0.08em; }
    .job-title { margin-top:0.5rem; color:#0f172a; font-size:clamp(1.75rem,4vw,2.5rem); line-height:1.08; font-weight:800; letter-spacing:0; }
    .job-meta { display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:1rem; }
    .job-badge { display:inline-flex; align-items:center; min-height:1.6rem; padding:0.25rem 0.65rem; border-radius:999px; border:1px solid transparent; font-size:0.75rem; line-height:1; font-weight:650; white-space:nowrap; }
    .job-badge-location { background:#eff6ff; border-color:#bfdbfe; color:#1d4ed8; }
    .job-badge-type { background:#ecfdf5; border-color:#bbf7d0; color:#047857; }
    .job-badge-mode { background:#f8fafc; border-color:#cbd5e1; color:#475569; }
    .job-layout { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:2rem; margin-top:1.75rem; align-items:start; }
    .job-main { min-width:0; }
    .job-section { padding:1.35rem 0; border-bottom:1px solid #e2e8f0; }
    .job-section:first-child { padding-top:0; }
    .job-section h2 { color:#0f172a; font-size:1rem; font-weight:750; }
    .job-section p { margin-top:0.625rem; color:#475569; font-size:0.9375rem; line-height:1.7; }
    .job-section ul { margin-top:0.75rem; padding-left:1.15rem; color:#475569; font-size:0.9375rem; line-height:1.65; list-style:disc; }
    .job-section li + li { margin-top:0.35rem; }
    .job-side { position:sticky; top:6rem; border-left:1px solid #e2e8f0; padding-left:1.25rem; }
    .job-side h2 { color:#0f172a; font-size:0.9375rem; font-weight:750; }
    .job-facts { display:grid; gap:0.875rem; margin-top:1rem; }
    .job-fact-label { color:#64748b; font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; }
    .job-fact-value { margin-top:0.15rem; color:#0f172a; font-size:0.9rem; font-weight:650; }
    .job-actions { display:grid; gap:0.625rem; margin-top:1.25rem; }
    .job-primary, .job-secondary, .job-muted { display:inline-flex; align-items:center; justify-content:center; min-height:2.35rem; padding:0.55rem 0.8rem; border-radius:0.5rem; font-size:0.875rem; font-weight:700; text-decoration:none; }
    .job-primary { background:#0f172a; color:#fff; }
    .job-secondary { border:1px solid #cbd5e1; color:#334155; background:#fff; }
    .job-muted { background:#e2e8f0; color:#64748b; }
    .job-status { color:#64748b; font-size:0.9375rem; line-height:1.65; }
    .job-empty { padding:1.25rem; border:1px solid #e2e8f0; border-radius:0.5rem; background:#f8fafc; }
    @media(max-width:760px) {
      .job-layout { grid-template-columns:1fr; gap:1rem; }
      .job-side { position:static; border-left:0; padding-left:0; border-top:1px solid #e2e8f0; padding-top:1.25rem; }
    }
  </style>
</head>
<body class="antialiased text-gray-800 bg-gray-50 inner-brand-bg">
<!-- bmas:header -->

<main id="main" class="px-6 pt-28 pb-16">
  <div
    id="jobDetails"
    class="job-shell bg-white p-8 rounded-lg shadow"
    data-jobs-src="https://bajbsufomaaozuqxtlxm.supabase.co/functions/v1/public-jobs"
    data-jobs-fallback-src="assets/jobs.json"
  >
    <a class="job-back" href="careers.html">Back to open roles</a>
    <p id="jobDetailsStatus" class="job-status mt-6">Loading role details...</p>
    <div id="jobDetailsContent"></div>
  </div>
</main>

<!-- bmas:footer -->
<!-- bmas:consult-modal -->

<script type="module" src="assets/site.js"></script>
<script type="module" src="assets/job-details.js"></script>
