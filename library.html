<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My BMAS Library - Purchased HR Resources</title>
  <meta name="description" content="Access your purchased BMAS HR resources, surveys, toolkits, and templates." />
  <link rel="canonical" href="https://www.bmas.co.za/library">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#12727C" />
  <link rel="icon" type="image/png" href="bmas.png" />
  <link rel="stylesheet" href="assets/tailwind.css?v=20260501-1" />
  <link rel="stylesheet" href="assets/site.css" />
</head>

<body class="antialiased text-gray-800 bg-gray-50 inner-brand-bg" data-page="documents">
<!-- bmas:header -->

<main id="main" class="max-w-6xl mx-auto px-6 pt-28 pb-16">
  <section class="resource-library-hero">
    <div>
      <p class="text-sm font-semibold uppercase tracking-[0.22em] text-amber-700">BMAS Library</p>
    </div>
    <div class="library-hero-actions">
      <span id="libraryAccountText" class="library-account-chip">Checking session...</span>
      <a href="/account?next=/library" class="library-secondary-action">Account</a>
      <a href="/documents" class="library-primary-action">Browse Store</a>
    </div>
  </section>

  <section class="mt-8">
    <div id="libraryStatus" class="text-sm text-slate-600">Loading your library...</div>
    <div id="libraryList" class="mt-5 grid gap-4 md:grid-cols-2"></div>
  </section>
</main>

<!-- bmas:footer -->
<!-- bmas:consult-modal -->

<script type="module" src="assets/site.js"></script>
<script type="module" src="assets/library.js"></script>
</body>
</html>
