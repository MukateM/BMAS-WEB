<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>BMAS Site Analytics</title>
  <link rel="icon" type="image/png" href="bmas.png" />
  <link rel="stylesheet" href="assets/tailwind.css" />
</head>
<body class="bg-slate-100 text-slate-900 antialiased">
  <main class="mx-auto max-w-6xl px-5 py-8">
    <section id="accessPanel" class="flex min-h-[80vh] items-center justify-center">
      <form id="analyticsForm" class="w-full max-w-sm rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <p class="text-sm font-semibold uppercase tracking-[0.18em] text-amber-700">BMAS</p>
        <h1 class="mt-2 text-2xl font-extrabold">Site Analytics</h1>
        <input id="analyticsKey" type="password" class="mt-5 w-full rounded border border-slate-300 px-3 py-3 text-sm" placeholder="Access code" autocomplete="current-password" autofocus required />
        <select id="analyticsDays" class="mt-3 w-full rounded border border-slate-300 px-3 py-3 text-sm">
          <option value="7">7 days</option>
          <option value="30" selected>30 days</option>
          <option value="90">90 days</option>
        </select>
        <button class="mt-3 w-full rounded bg-slate-900 px-4 py-3 text-sm font-semibold text-white hover:bg-slate-700">Continue</button>
        <div id="status" class="mt-4 hidden rounded-lg border border-slate-200 bg-white p-3 text-sm text-slate-600"></div>
      </form>
    </section>

    <section id="dashboardShell" class="hidden">
      <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.18em] text-amber-700">BMAS</p>
          <h1 class="mt-2 text-3xl font-extrabold">Site Analytics</h1>
          <p class="mt-2 text-sm text-slate-600">First-party pageviews, visitors, referrers, devices, and top pages.</p>
        </div>
        <form id="rangeForm" class="flex flex-col gap-2 rounded-lg border border-slate-200 bg-white p-3 shadow-sm sm:flex-row">
          <select id="rangeDays" class="rounded border border-slate-300 px-3 py-2 text-sm">
            <option value="7">7 days</option>
            <option value="30" selected>30 days</option>
            <option value="90">90 days</option>
          </select>
          <button class="rounded bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700">Refresh</button>
        </form>
      </div>

    <section class="grid gap-3 md:grid-cols-4">
      <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Pageviews</p>
        <p id="totalPageviews" class="mt-2 text-3xl font-extrabold">0</p>
      </div>
      <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Visitors</p>
        <p id="totalVisitors" class="mt-2 text-3xl font-extrabold">0</p>
      </div>
      <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Sessions</p>
        <p id="totalSessions" class="mt-2 text-3xl font-extrabold">0</p>
      </div>
      <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Events</p>
        <p id="totalEvents" class="mt-2 text-3xl font-extrabold">0</p>
      </div>
    </section>

    <section class="mt-6 grid gap-4 lg:grid-cols-2">
      <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <h2 class="font-bold">Daily Pageviews</h2>
        <div id="dailyChart" class="mt-4 space-y-2"></div>
      </div>
      <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <h2 class="font-bold">Top Pages</h2>
        <div id="topPages" class="mt-4 space-y-2"></div>
      </div>
      <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <h2 class="font-bold">Referrers</h2>
        <div id="referrers" class="mt-4 space-y-2"></div>
      </div>
      <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <h2 class="font-bold">Devices</h2>
        <div id="devices" class="mt-4 space-y-2"></div>
      </div>
      <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <h2 class="font-bold">Browsers</h2>
        <div id="browsers" class="mt-4 space-y-2"></div>
      </div>
      <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <h2 class="font-bold">Countries</h2>
        <div id="countries" class="mt-4 space-y-2"></div>
      </div>
    </section>
    </section>
  </main>

  <script type="module" src="assets/analytics-dashboard.js"></script>
</body>
</html>
