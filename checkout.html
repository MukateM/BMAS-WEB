<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Checkout - BMAS Resource Store</title>
  <meta name="description" content="BMAS Resource Store checkout." />
  <link rel="canonical" href="https://www.bmas.co.za/checkout">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#12727C" />
  <link rel="icon" type="image/png" href="bmas.png" />
  <link rel="stylesheet" href="assets/tailwind.css?v=20260501-1" />
  <link rel="stylesheet" href="assets/site.css" />
</head>

<body class="antialiased text-gray-800 bg-gray-50 inner-brand-bg" data-page="documents">
<!-- bmas:header -->

<main id="main" class="max-w-6xl mx-auto px-6 pt-28 pb-16">
  <div class="mb-6">
    <a href="/documents" class="text-sm font-semibold text-teal-700 hover:text-teal-900">Back to Resource Store</a>
  </div>

  <section class="checkout-shell">
    <section class="checkout-summary">
      <p class="text-sm font-semibold uppercase tracking-[0.22em] text-amber-700">Checkout</p>
      <p class="mt-3 text-slate-600">Your resource will appear in your BMAS Library after payment confirmation.</p>

      <div id="checkoutResourceCard" class="mt-6 rounded border border-slate-200 bg-slate-50 p-5">
        <p class="text-sm text-slate-600">Loading selected resource...</p>
      </div>
    </section>

    <aside class="checkout-panel">
      <section class="rounded border border-slate-200 bg-white p-5 shadow-sm">
        <h2 class="text-lg font-bold text-slate-900">1. BMAS Library account</h2>
        <div id="checkoutAccountBar" class="hidden mt-3 rounded border border-emerald-200 bg-emerald-50 p-3">
          <p id="checkoutAccountText" class="text-sm font-medium text-emerald-900"></p>
          <div class="mt-3 flex gap-2">
            <a href="/library" class="rounded bg-emerald-700 px-3 py-2 text-sm font-semibold text-white">Open Library</a>
            <button id="checkoutSignOut" type="button" class="rounded border border-emerald-300 px-3 py-2 text-sm font-semibold text-emerald-900">Sign out</button>
          </div>
        </div>

        <div id="checkoutAuthPanel" class="mt-3 rounded border border-slate-200 bg-slate-50 p-4">
          <h3 id="checkoutAuthTitle" class="text-sm font-bold text-slate-900">Sign in to continue</h3>
          <form id="checkoutAuthForm" class="mt-4 space-y-3">
            <label id="checkoutAuthNameWrap" class="hidden block text-sm text-slate-700">
              <span class="font-medium">Full name</span>
              <input id="checkoutAuthName" class="mt-1 w-full rounded border border-slate-300 px-3 py-2" autocomplete="name" />
            </label>
            <label class="block text-sm text-slate-700">
              <span class="font-medium">Email address</span>
              <input id="checkoutAuthEmail" type="email" class="mt-1 w-full rounded border border-slate-300 px-3 py-2" autocomplete="email" required />
            </label>
            <label class="block text-sm text-slate-700">
              <span class="font-medium">Password</span>
              <input id="checkoutAuthPassword" type="password" class="mt-1 w-full rounded border border-slate-300 px-3 py-2" autocomplete="current-password" required />
            </label>
            <button id="checkoutAuthSubmit" type="submit" class="documents-primary-btn">Sign in</button>
            <button id="checkoutAuthToggle" type="button" class="w-full rounded border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-700">New here? Create an account</button>
            <p id="checkoutAuthStatus" class="min-h-5 text-sm text-slate-600" role="status"></p>
          </form>
        </div>
      </section>

      <section class="mt-5 rounded border border-slate-200 bg-white p-5 shadow-sm">
        <h2 class="text-lg font-bold text-slate-900">2. Mobile-money payment</h2>
        <p id="checkoutPaymentIntro" class="mt-2 text-sm text-slate-600">Sign in and confirm the resource above to continue.</p>
        <form id="checkoutPaymentForm" class="mt-5 space-y-4">
          <label class="block text-sm text-slate-700">
            <span class="font-medium">Mobile money number</span>
            <input id="checkoutCustomerPhone" class="mt-1 w-full rounded border border-slate-300 px-3 py-2" autocomplete="tel" placeholder="+260..." required />
          </label>
          <button id="checkoutPaymentButton" type="submit" class="documents-primary-btn" disabled>
            Send payment request
          </button>
          <p id="checkoutPaymentStatus" class="min-h-5 text-sm text-slate-600" role="status"></p>
        </form>
      </section>
    </aside>
  </section>
</main>

<!-- bmas:footer -->
<!-- bmas:consult-modal -->

<script type="module" src="assets/site.js"></script>
<script type="module" src="assets/checkout.js"></script>
</body>
</html>
