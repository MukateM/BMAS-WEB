<body class="antialiased text-gray-800 bg-gray-50 inner-brand-bg" data-page="hr-metrics">
<!-- bmas:header -->

<main id="main" class="max-w-6xl mx-auto px-6 pt-28 pb-16 space-y-8">
  <section class="bg-white p-6 md:p-8 rounded-lg shadow">
    <div class="max-w-3xl">
      <p class="text-sm font-semibold uppercase tracking-[0.18em] text-amber-600">BMAS HR Metrics</p>
      <h1 class="mt-3 text-3xl font-extrabold text-slate-900">HR Metrics Calculator</h1>
      <p class="mt-3 text-slate-600">
        Calculate practical HR indicators for management reports, workforce reviews, and people analytics dashboards.
      </p>
    </div>

    <div class="mt-6 grid gap-6 lg:grid-cols-[0.95fr_1.05fr]">
      <form id="hrMetricsForm" class="rounded-lg border bg-slate-50 p-5">
        <label for="metricSelect" class="block text-sm font-semibold text-slate-800">Metric</label>
        <select id="metricSelect" class="mt-2 w-full rounded border px-3 py-2"></select>

        <div id="metricContext" class="mt-4 rounded border bg-white p-4 text-sm text-slate-600"></div>
        <div id="metricInputs" class="mt-4 grid gap-4 sm:grid-cols-2"></div>

        <div class="mt-5 flex flex-wrap gap-3">
          <button type="submit" class="rounded bg-slate-900 px-4 py-2 font-semibold text-white">Calculate</button>
          <button id="clearHrMetrics" type="button" class="rounded border px-4 py-2 font-semibold">Clear</button>
        </div>
      </form>

      <section id="metricResult" class="rounded-lg border bg-white p-5">
        <div class="text-sm font-semibold uppercase tracking-[0.16em] text-slate-500">Result</div>
        <div id="metricResultValue" class="mt-4 text-4xl font-extrabold text-slate-950">--</div>
        <div id="metricResultLabel" class="mt-2 text-lg font-bold text-slate-900">Select a metric and enter values.</div>
        <p id="metricResultMeaning" class="mt-3 text-sm leading-6 text-slate-600"></p>
        <div class="mt-5 rounded bg-amber-50 p-4 text-sm text-amber-900">
          <div class="font-semibold">Formula</div>
          <div id="metricResultFormula" class="mt-1"></div>
        </div>
      </section>
    </div>
  </section>

  <section class="bg-white p-6 md:p-8 rounded-lg shadow">
    <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
      <div>
        <h2 class="text-2xl font-extrabold text-slate-900">Top 20 HR Metrics</h2>
      </div>
      <input id="metricSearch" type="search" class="rounded border px-3 py-2 text-sm" placeholder="Search metrics" />
    </div>
    <div id="metricLibrary" class="mt-5 grid gap-4 md:grid-cols-2"></div>
  </section>
</main>

<!-- bmas:footer -->
<!-- bmas:consult-modal -->

<script type="module" src="assets/site.js"></script>
<script type="module" src="assets/hr-metrics-calculator.js"></script>
</body>
</html>
